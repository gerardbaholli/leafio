name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pushing the built site onto the gh-pages branch needs write access to the
# repository. The artifact-based `pages: write` / `id-token: write` pair is not
# used by this method.
permissions:
  contents: write

# Let a running deploy finish being superseded rather than racing it — two jobs
# pushing gh-pages at once would reject each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runs the merch-kit boundary guard too, so a change that breaks the
      # kit's portability stops the deploy instead of shipping.
      - run: pnpm test

      - run: pnpm build

      # Publishes dist/ as the whole content of gh-pages, creating the branch on
      # the first run. Writes .nojekyll so Pages serves the files as they are
      # instead of running them through Jekyll.
      - name: Publish dist/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # The action appends the source SHA, so this is a prefix, not the
          # whole message — repeating the SHA here would print it twice.
          commit_message: Deploy
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
